name: Sync Bakalari Calendar

# Synchronizace rozvrhu z Bakalářů probíhá přes GitHub Actions:
# - každých 5 minut ve všední dny
# - vnitřně script zkontroluje, zda právě uplynulo přesně 20 minut od začátku nějaké vyučovací hodiny
# - ručně lze spustit i přes workflow_dispatch
on:
  schedule:
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run script
        env:
          BAK_USER: ${{ secrets.BAK_USER }}
          BAK_PASS: ${{ secrets.BAK_PASS }}
          BAK_URL: https://gyarab.bakalari.cz
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: python sync.py
