name: Bakalari to Google Calendar Sync

on:
  schedule:
    # Běží v pracovní dny každých 30 minut od 6:00 do 17:00 UTC (cca 7:00/8:00 až 18:00/19:00 v ČR)
    - cron: '*/30 6-16 * * 1-5'
    # Běží v neděli večer v 18:00 UTC pro včasné načtení rozvrhu na nový týden
    - cron: '0 18 * * 0'
  workflow_dispatch: # Umožňuje spustit synchronizaci ručně z rozhraní GitHubu

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run timetable synchronization
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          # 1. Uživatel
          BAK_USER_1: ${{ secrets.BAK_USER_1 }}
          BAK_PASS_1: ${{ secrets.BAK_PASS_1 }}
          CALENDAR_ID_1: ${{ secrets.CALENDAR_ID_1 }}
          # 2. Uživatel
          BAK_USER_2: ${{ secrets.BAK_USER_2 }}
          BAK_PASS_2: ${{ secrets.BAK_PASS_2 }}
          CALENDAR_ID_2: ${{ secrets.CALENDAR_ID_2 }}
          # Globální nastavení (volitelné)
          BAK_URL: "https://gyarab.bakalari.cz"
          RESPECT_20MIN_RULE: "false"
        run: python sync.py
